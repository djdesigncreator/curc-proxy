name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Buscar o codigo
        uses: actions/checkout@v4

      - name: Entrar no Docker Hub
        run: |
          USER=$(printf '%s' '${{ secrets.DOCKERHUB_USER }}' | tr -d '[:space:]')
          TOKEN=$(printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | tr -d '[:space:]')
          printf '%s' "$TOKEN" | docker login -u "$USER" --password-stdin

      - name: Preparar o buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            nikayia/curc-proxy:latest
            nikayia/curc-proxy:${{ github.sha }}
